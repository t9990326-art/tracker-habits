<body>
<title>Не рви цепь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Стиль иконки: фиолетовый календарь, зелёные галочки, золотой кубок, чёрная обводка.
   Layout: одна колонка-телефон. Шапка с кольцом и «цепью» последних 14 дней → отметки дня по привычкам → серии → календарь.
   Стикерный стиль: жирная тёмно-синяя обводка + жёсткая тень, цвет задаёт каждая привычка. Единая светлая тема. */
:root{
  --bg:#F0EBFF; --card:#FDFCFF; --ink:#17121F; --muted:#5F5675; --line:rgba(23,18,31,.12);
  --accent:#7B4DFF; --ok:#1FB85C; --bad:#FF4D5E; --link:#DCD2FA; --gold:#FFC21A; --gold-soft:#FFEDB0;
  --display:"Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;
  -webkit-tap-highlight-color:transparent}
main{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,.num{font-family:var(--display);font-weight:900;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:27px;line-height:1.1}
h2{font-size:19px}
.muted{color:var(--muted)}
.st{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.press{transition:transform .08s,box-shadow .08s}
.press:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.press:disabled{opacity:.35;cursor:default;transform:none}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--card);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.acc{background:var(--accent);color:#fff}

/* шапка */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .tools{display:flex;gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:58px;height:58px;flex:none;filter:drop-shadow(0 3px 0 rgba(23,18,31,.25))}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:4px}
.hero{padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;align-items:center;gap:16px}
.ring{width:88px;height:88px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);
  background:conic-gradient(var(--accent) calc(var(--p)*1turn),var(--link) 0)}
.ring .num{width:66px;height:66px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-size:24px;font-variant-numeric:tabular-nums}
.hero-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-txt b{font-size:18px;font-weight:800}
.hero-txt span{font-size:13px}
.chain{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:0;align-items:center}
.chain i{height:16px;border:2.5px solid var(--ink);border-radius:99px;background:var(--link);margin-inline:-2px;position:relative}
.chain i.ok{background:#4BE36A}.chain i.bad{background:var(--bad)}
.chain i.today{outline:2px dashed var(--ink);outline-offset:2px}
.chain-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-6px}
.pill{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:800}

/* день */
.card{padding:16px;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .t{text-align:center}
.nav .t b{display:block;font-family:var(--display);font-size:17px;font-weight:800}
.nav .t span{font-size:13px}
.arr{width:42px;height:42px;border-radius:12px;background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}
.arr svg{width:16px;height:16px}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.habit+.habit{border-top:2px solid var(--line);padding-top:14px}
.tile{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:24px;flex:none;padding:0}
.habit .nm{min-width:0;text-align:left;background:none;border:0;padding:0}
.habit .nm b{display:block;font-size:16px;font-weight:800;overflow-wrap:anywhere}
.habit .nm span{font-size:12px;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:8px}
.mk{width:104px;height:34px;border-radius:10px;background:var(--bg);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:13px;font-weight:800}
.mk[aria-pressed="true"]{color:#fff;box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.mk.ok[aria-pressed="true"]{background:var(--ok)}
.mk.bad[aria-pressed="true"]{background:var(--bad)}
.add{height:48px;border-radius:14px;border:2.5px dashed var(--ink);background:transparent;font-weight:800;font-size:15px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px;background:var(--card)}

/* серии */
.streaks{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.sk{border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.sk .e{font-size:22px}
.sk .num{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.sk span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* календарь */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);margin-right:5px;vertical-align:-2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 6px}
.wd{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.cell{min-height:46px;border-radius:10px;background:var(--bg);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.cell.empty{visibility:hidden}
.cell.ok{background:var(--ok);color:#fff}
.cell.bad{background:var(--bad);color:#fff}
.cell.goal{background:var(--gold-soft)}
.cell.sel{border-width:3.5px;box-shadow:0 3px 0 var(--ink)}
.cell:disabled{opacity:.35;cursor:default}
.cell.goal:disabled{opacity:1}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.flag{font-size:9px;line-height:1}

/* оверлеи */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(18px,env(safe-area-inset-left,0px))}
.ov .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.btn{height:46px;padding:0 18px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:15px;background:var(--card)}
.btn.acc{background:var(--accent);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:15px}
.mode .e{font-size:26px}
.mode[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 2px 0 var(--ink)}
.field{padding:16px;display:flex;flex-direction:column;gap:10px}
.field .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
label.lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=date],input[type=text]{font-weight:800;font-size:16px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px;padding:10px 12px;min-height:46px;max-width:100%}
input[type=text]{width:100%}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:20px;padding:0}
.emojis button[aria-pressed="true"]{border:3px solid var(--ink);background:var(--gold-soft)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);padding:0}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.preview{display:flex;align-items:center;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* поздравление */
.cele .in{align-items:center;text-align:center;min-height:calc(100dvh - 60px);justify-content:center}
.cup{width:160px;height:160px;border-radius:50%;background:var(--accent);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.cup span{width:118px;height:118px;border-radius:50%;background:var(--card);border:4px solid var(--ink);display:grid;place-items:center;font-size:62px}
.cele h1{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.wide{width:100%;height:54px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.conf span{position:absolute;top:-30px;width:12px;height:18px;border:2px solid var(--ink);border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(calc(100dvh + 80px)) rotate(var(--r))}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.cup{animation:none}.press,.mk{transition:none}}
</style>

<script>
const COLORS=["#7B4DFF","#4BE36A","#FFC21A","#FF8A3D","#3DA5FF","#FF5CA8","#14C8B0","#A98BFF"];
const EMOJIS=["💪","🏃","🧘","🚴","💧","🥗","🍎","🚭","🍷","🍬","📚","✍️","🧠","🇬🇧","💻","🎸","😴","⏰","🧹","💊","📵","🙏","💰","🌿"];
const SUGG=[
  {name:"Тренировка",emoji:"💪",color:"#FF8A3D"},
  {name:"Выпить 2 литра воды",emoji:"💧",color:"#3DA5FF"},
  {name:"Читать 20 минут",emoji:"📚",color:"#7B4DFF"},
  {name:"Без сладкого",emoji:"🍬",color:"#FF5CA8"},
  {name:"Лечь до 23:00",emoji:"😴",color:"#14C8B0"},
  {name:"Без соцсетей до обеда",emoji:"📵",color:"#FFC21A"},
];
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WDF=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const I_L='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5 5 8l5.5 5.5"/></svg>';
const I_R='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 2.5 11 8l-5.5 5.5"/></svg>';
const I_GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>';
const I_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const today=()=>key(new Date());
const diff=(a,b)=>{const u=s=>{const[p,q,r]=s.split("-").map(Number);return Date.UTC(p,q-1,r)};return Math.round((u(b)-u(a))/864e5)};
const nice=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soft=c=>`color-mix(in srgb, ${c} 24%, white)`;
function plural(n,f=["день","дня","дней"]){const a=n%10,b=n%100;if(a===1&&b!==11)return f[0];if(a>=2&&a<=4&&!(b>=12&&b<=14))return f[1];return f[2]}
const uid=()=>Math.random().toString(36).slice(2,9);

/* состояние */
let S={habits:[],days:{},start:today(),hasGoal:false,goal:add(today(),30)};
let sel=today(), month=today().slice(0,7), ui=null, edit=null, confirmDel=false;
let docRef=null, saveTimer=null;

function load(){try{const v=JSON.parse(localStorage.getItem("chain-v1")||"null");if(v&&v.habits)S={...S,...v}}catch(e){}}
function save(){
  try{localStorage.setItem("chain-v1",JSON.stringify(S))}catch(e){}
  if(!docRef)return; clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{docRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{})},500);
}

const active=d=>S.habits.filter(h=>h.from<=d);
const mark=(d,id)=>(S.days[d]||{})[id];
function dayState(d){const hs=active(d);if(!hs.length)return null;const v=S.days[d]||{};if(hs.some(h=>v[h.id]==="bad"))return"bad";if(hs.every(h=>v[h.id]==="ok"))return"ok";return null}
function streak(h){let d=today(),n=0;const lo=h.from>S.start?h.from:S.start;if(!mark(d,h.id))d=add(d,-1);while(d>=lo&&mark(d,h.id)==="ok"){n++;d=add(d,-1)}return n}
function chain(){let d=today(),n=0;if(!dayState(d))d=add(d,-1);while(d>=S.start&&dayState(d)==="ok"){n++;d=add(d,-1)}return n}
function best(){let b=0,c=0,d=S.start,t=today();while(d<=t){if(dayState(d)==="ok"){c++;b=Math.max(b,c)}else c=0;d=add(d,1)}return b}
function cleanDays(a,b){let n=0,d=a;while(d<=b){if(dayState(d)==="ok")n++;d=add(d,1)}return n}

/* отрисовка */
function render(){
  const t=today();
  const left=Math.max(0,diff(t,S.goal));
  let num,p,head,sub;
  if(S.hasGoal){
    const total=Math.max(1,diff(S.start,S.goal));
    num=left;p=Math.min(1,Math.max(0,(total-left)/total));
    if(t>S.goal||dayState(S.goal)==="ok"){head="Цель взята! 🔥";sub="Ставь новую дату или переходи в бесконечный режим."}
    else if(left===0){head="Последний день!";sub="Закрой все привычки сегодня, и цель твоя."}
    else{head=plural(left)+" до "+nice(S.goal);sub="Прогресс от старта до цели."}
  }else{
    const c=chain(),b=best();num=c;p=b?Math.min(1,c/b):0;
    head=plural(c)+" подряд без пропусков";sub=`<span class="pill">Рекорд: ${b} ${plural(b)}</span>`;
  }
  // цепь последних 14 дней
  let links="";for(let i=13;i>=0;i--){const d=add(t,-i);const s=d<S.start?"":(dayState(d)||"");links+=`<i class="${s} ${i===0?"today":""}" title="${nice(d)}"></i>`}

  const hs=active(sel);
  const sd=parse(sel), rel=sel===t?"Сегодня":sel===add(t,-1)?"Вчера":WDF[sd.getDay()];
  let dayBody;
  if(!S.habits.length){
    dayBody=`<div class="empty"><h2>Добавь первую привычку</h2><span class="muted">Нажми на готовую или создай свою.</span>
      <div class="sugg">${SUGG.map((s,i)=>`<button class="chip press" data-act="sugg" data-i="${i}">${s.emoji} ${esc(s.name)}</button>`).join("")}</div>
      <button class="add press" style="width:100%" data-act="new">+ Своя привычка</button></div>`;
  }else{
    dayBody=(hs.length?hs.map(h=>{const m=mark(sel,h.id);return`
      <div class="habit">
        <button class="tile press" style="background:${h.color}" data-act="edit" data-id="${h.id}" aria-label="Изменить «${esc(h.name)}»">${esc(h.emoji)}</button>
        <button class="nm" data-act="edit" data-id="${h.id}"><b>${esc(h.name)}</b><span>серия: ${streak(h)} ${plural(streak(h))}</span></button>
        <div class="btns">
          <button class="mk ok press" data-act="mark" data-id="${h.id}" data-v="ok" aria-pressed="${m==="ok"}">Выполнил</button>
          <button class="mk bad press" data-act="mark" data-id="${h.id}" data-v="bad" aria-pressed="${m==="bad"}">Пропустил</button>
        </div>
      </div>`}).join(""):`<span class="muted">В этот день привычек ещё не было.</span>`)
      +`<button class="add press" data-act="new">+ Добавить привычку</button>`;
  }

  const streaks=S.habits.map(h=>{const n=streak(h);return`<div class="sk st" style="background:${soft(h.color)}"><span class="e" aria-hidden="true">${esc(h.emoji)}</span><span class="num">${n}</span><span>${esc(h.name)}</span></div>`}).join("");

  const minM=S.start.slice(0,7), maxM=(S.hasGoal&&S.goal>t?S.goal:t).slice(0,7);
  if(month<minM)month=minM; if(month>maxM)month=maxM;
  const[yy,mm]=month.split("-").map(Number);
  const first=new Date(yy,mm-1,1),count=new Date(yy,mm,0).getDate(),off=(first.getDay()+6)%7;
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join("")+"<div class='cell empty'></div>".repeat(off);
  for(let i=1;i<=count;i++){
    const d=yy+"-"+pad(mm)+"-"+pad(i),st=dayState(d),isGoal=S.hasGoal&&d===S.goal,dis=d>t||d<S.start;
    const cls=["cell","press",st||"",(!st&&isGoal)?"goal":"",d===sel?"sel":""].join(" ");
    const inner=st?"":isGoal?'<span class="flag">🏁</span>':`<span class="dots">${active(d).slice(0,8).map(h=>{const m=mark(d,h.id);return`<i style="${m==="ok"?"background:"+h.color:m==="bad"?"background:var(--bad)":""}"></i>`}).join("")}</span>`;
    cells+=`<button class="${cls}" data-act="pick" data-d="${d}" ${dis?"disabled":""} aria-label="${i} ${MON[mm-1]}">${i}${inner}</button>`;
  }

function renderLayer(){
  const L=document.getElementById("layer");
  if(ui==="settings"){
    L.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-label="Настройки"><div class="in">
      <div class="top"><h1>Настройки</h1><button class="btn acc press" data-act="close">Готово</button></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <label class="lbl">Цель</label>
        <div class="modes">
          <button class="mode st press" data-act="mode" data-v="goal" aria-pressed="${S.hasGoal}"><span class="e">📅</span>До даты</button>
          <button class="mode st press" data-act="mode" data-v="endless" aria-pressed="${!S.hasGoal}"><span class="e">♾️</span>Бесконечно</button>
        </div>
        <span class="muted" style="font-size:13px">${S.hasGoal?"Наверху будет обратный отсчёт до выбранной даты, а в последний день, если закроешь все привычки, будет поздравление.":"Без конечной даты. Наверху считается, сколько дней подряд ты закрываешь все привычки, и твой рекорд."}</span>
      </div>
      ${S.hasGoal?`<div class="field st"><div class="row"><b>🏁 Держусь до</b><input type="date" id="goal" value="${S.goal}" min="${today()}"></div></div>`:""}
      <div class="field st"><div class="row"><b>🚀 Старт</b><input type="date" id="start" value="${S.start}" max="${today()}"></div>
        <span class="muted" style="font-size:12px">С этого дня считаются цепь и прогресс. Отметки никуда не деваются.</span></div>
    </div></div>`;
  }else if(ui==="edit"){
    const h=edit;
    L.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-label="Привычка"><div class="in">
      <div class="top"><h1>${h.isNew?"Новая привычка":"Привычка"}</h1><button class="btn press" data-act="close">Отмена</button></div>
      <div class="preview field st"><div class="row" style="justify-content:flex-start">
        <span class="tile" id="pvTile" style="background:${h.color}">${esc(h.emoji)}</span>
        <b id="pvName" style="font-size:18px;overflow-wrap:anywhere">${esc(h.name||"Название")}</b></div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="lbl" for="hName">Что соблюдаешь</label>
        <input type="text" id="hName" maxlength="40" placeholder="Например: 10 000 шагов" value="${esc(h.name)}" autocomplete="off">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="lbl">Значок</label>
        <div class="emojis">${EMOJIS.map(e=>`<button data-act="emoji" data-e="${e}" aria-pressed="${h.emoji===e}">${e}</button>`).join("")}</div>
        <input type="text" id="hEmoji" maxlength="8" placeholder="или вставь свой эмодзи" value="${EMOJIS.includes(h.emoji)?"":esc(h.emoji)}" autocomplete="off">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="lbl">Цвет</label>
        <div class="colors">${COLORS.map(c=>`<button data-act="color" data-c="${c}" style="background:${c}" aria-label="Цвет ${c}" aria-pressed="${h.color===c}"></button>`).join("")}</div>
      </div>
      <div class="actions">
        <button class="btn acc press" data-act="saveHabit">${h.isNew?"Добавить":"Сохранить"}</button>
        ${h.isNew?"":`<button class="btn ${confirmDel?"danger":""} press" data-act="del">${confirmDel?"Точно удалить?":"Удалить"}</button>`}
      </div>
      <span class="muted" id="hErr" style="font-size:13px"></span>
    </div></div>`;
  }else if(ui==="cele"){
    let conf="";for(let i=0;i<46;i++)conf+=`<span style="left:${(2+Math.random()*96).toFixed(1)}%;background:${COLORS[i%COLORS.length]};animation-duration:${(2.8+Math.random()*3).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s;--r:${Math.round(Math.random()*900-450)}deg"></span>`;
    const cd=cleanDays(S.start,S.goal),tot=diff(S.start,S.goal)+1,b=best();
    L.innerHTML=`<div class="ov cele" role="dialog" aria-modal="true" aria-label="Поздравление"><div class="in">
      <div class="cup"><span>🏆</span></div>
      <h1>Цепь не порвалась!</h1>
      <p class="muted" style="margin:0;font-size:16px">Ты дошёл до цели. Мощно, бро, так держать!</p>
      <div class="stats">
        <div class="sk st" style="background:${soft("#4BE36A")}"><span class="num">${cd}</span><span>${plural(cd,["день","дня","дней"])} всё<br>выполнено</span></div>
        <div class="sk st" style="background:${soft("#FFC21A")}"><span class="num">${tot}</span><span>${plural(tot)}<br>пути</span></div>
        <div class="sk st" style="background:${soft("#7B4DFF")}"><span class="num">${b}</span><span>рекорд<br>подряд</span></div>
      </div>
      <button class="btn acc wide press" data-act="endless">Погнали дальше бесконечно ♾️</button>
      <button class="btn wide press" data-act="close">Закрыть</button>
    </div></div><div class="conf" aria-hidden="true">${conf}</div>`;
  }else L.innerHTML="";
  document.body.style.overflow=ui?"hidden":"";
}

function openEdit(h){edit=h?{...h,isNew:false}:{id:uid(),name:"",emoji:"💪",color:COLORS[S.habits.length%COLORS.length],isNew:true};confirmDel=false;ui="edit";renderLayer();setTimeout(()=>{const i=document.getElementById("hName");if(i&&edit.isNew)i.focus()},50)}
function addHabit(h){S.habits=[...S.habits,{id:uid(),name:h.name,emoji:h.emoji,color:h.color,from:sel<today()?sel:today()}];save()}

/* события */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="mark"){
    const id=b.dataset.id,v=b.dataset.v,day={...(S.days[sel]||{})};
    if(day[id]===v)delete day[id];else day[id]=v;
    S.days={...S.days,[sel]:day};save();
    if(v==="ok"&&S.hasGoal&&sel===S.goal&&dayState(sel)==="ok"){ui="cele";try{navigator.vibrate&&navigator.vibrate([30,60,30])}catch(_){}}
    render();
  }
  else if(a==="pick"){sel=b.dataset.d;render();window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="prev"){sel=add(sel,-1);render()}
  else if(a==="next"){sel=add(sel,1);render()}
  else if(a==="mprev"||a==="mnext"){const[y,m]=month.split("-").map(Number);const d=new Date(y,m-1+(a==="mnext"?1:-1),1);month=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}
  else if(a==="settings"){ui="settings";renderLayer()}
  else if(a==="close"){ui=null;edit=null;render()}
  else if(a==="mode"){S.hasGoal=b.dataset.v==="goal";if(S.hasGoal&&S.goal<today())S.goal=add(today(),30);save();render()}
  else if(a==="endless"){S.hasGoal=false;ui=null;save();render()}
  else if(a==="sugg"){addHabit(SUGG[+b.dataset.i]);render()}
  else if(a==="new"){openEdit(null)}
  else if(a==="edit"){openEdit(S.habits.find(h=>h.id===b.dataset.id))}
  else if(a==="emoji"){edit.emoji=b.dataset.e;document.getElementById("hEmoji").value="";syncPreview();document.querySelectorAll(".emojis button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.e===edit.emoji))}
  else if(a==="color"){edit.color=b.dataset.c;syncPreview();document.querySelectorAll(".colors button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===edit.color))}
  else if(a==="saveHabit"){
    edit.name=document.getElementById("hName").value.trim();
    if(!edit.name){document.getElementById("hErr").textContent="Напиши название привычки.";document.getElementById("hName").focus();return}
    if(edit.isNew)addHabit(edit);
    else{S.habits=S.habits.map(h=>h.id===edit.id?{...h,name:edit.name,emoji:edit.emoji,color:edit.color}:h);save()}
    ui=null;edit=null;render();
  }
  else if(a==="del"){
    if(!confirmDel){confirmDel=true;renderLayer();return}
    S.habits=S.habits.filter(h=>h.id!==edit.id);save();ui=null;edit=null;render();
  }
});
function syncPreview(){const t=document.getElementById("pvTile"),n=document.getElementById("pvName");if(t){t.style.background=edit.color;t.textContent=edit.emoji}if(n)n.textContent=edit.name||"Название"}
document.addEventListener("input",e=>{
  if(!edit)return;
  if(e.target.id==="hName"){edit.name=e.target.value;syncPreview();document.getElementById("hErr").textContent=""}
  if(e.target.id==="hEmoji"&&e.target.value.trim()){edit.emoji=[...e.target.value.trim()].slice(0,2).join("");syncPreview();document.querySelectorAll(".emojis button").forEach(x=>x.setAttribute("aria-pressed","false"))}
});
document.addEventListener("change",e=>{
  if(e.target.id==="goal"&&e.target.value){S.goal=e.target.value<today()?today():e.target.value;save();render()}
  if(e.target.id==="start"&&e.target.value){S.start=e.target.value>today()?today():e.target.value;if(sel<S.start)sel=S.start;save();render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ui){ui=null;edit=null;render()}
  if(e.key==="Enter"&&ui==="edit"&&e.target.id==="hName"){e.preventDefault();document.querySelector('[data-act="saveHabit"]').click()}
});

load();render();
setInterval(()=>{if(document.visibilityState==="visible"&&!ui)render()},60000);

/* синхронизация через аккаунт Claude, если открыто как артефакт */
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await claude.use("db"),user=await claude.use("user");
    const id=user?await user.id():null;if(!db||!id)return;
    docRef=db.doc("data/users/"+id+"/chain");
    let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.exists){const r=snap.data();if(r&&r.habits){S={...S,...r,days:{...S.days,...r.days}};try{localStorage.setItem("chain-v1",JSON.stringify(S))}catch(_){}if(!ui)render()}}
      else if(first&&S.habits.length)save();
      first=false;
    },()=>{});
  }catch(_){}
})();
</script>
